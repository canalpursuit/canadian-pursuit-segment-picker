name: Screen countryside segments (review only)
on:
  push:
    branches:
      - development/v8.9-mobile-day-navigation
    paths:
      - 'scripts/screen_countryside.py'
      - '.github/workflows/countryside-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests shapely pyproj
      - run: python scripts/screen_countryside.py
      - uses: actions/upload-artifact@v4
        with:
          name: countryside-candidates-unverified
          path: |
            data/countryside-review.csv
            data/countryside-candidates.json
          retention-days: 30
